<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wonkittiez — order lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14121f;
    --surface:#1f1b2e;
    --surface-2:#292342;
    --pink:#ff6ec7;
    --cyan:#6ee7f0;
    --text:#f5f2fa;
    --muted:#9b93b0;
    --line:#3a3350;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(255,110,199,0.16), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(110,231,240,0.14), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    padding:64px 20px 100px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
  }
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--cyan);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .eyebrow::before{
    content:"";
    width:20px;height:1px;
    background:var(--cyan);
    display:inline-block;
  }
  h1{
    font-family:'Unbounded', sans-serif;
    font-weight:800;
    font-size:clamp(32px, 6vw, 46px);
    line-height:1.08;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  h1 span{
    background:linear-gradient(100deg, var(--pink), var(--cyan));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    color:var(--muted);
    font-size:15.5px;
    line-height:1.55;
    max-width:46ch;
    margin:0 0 40px;
  }
  .search-box{
    position:relative;
    margin-bottom:8px;
  }
  .search-box label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .input-row{
    display:flex;
    gap:10px;
  }
  input[type="text"]{
    flex:1;
    background:var(--surface);
    border:1.5px solid var(--line);
    color:var(--text);
    font-family:'Space Mono', monospace;
    font-size:17px;
    padding:16px 18px;
    border-radius:12px;
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  input[type="text"]::placeholder{color:#655d7c;}
  input[type="text"]:focus{
    border-color:var(--pink);
    box-shadow:0 0 0 3px rgba(255,110,199,0.18);
  }
  button{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--bg);
    background:linear-gradient(100deg, var(--cyan), var(--pink));
    border:none;
    border-radius:12px;
    padding:0 24px;
    cursor:pointer;
    transition:transform .15s ease, filter .15s ease;
  }
  button:hover{filter:brightness(1.08);}
  button:active{transform:scale(0.97);}
  button:focus-visible, input:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}

  .results{
    margin-top:44px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .status-line{
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    color:var(--muted);
    margin-top:44px;
    margin-bottom:-26px;
    letter-spacing:0.02em;
  }
  .status-line strong{color:var(--text);}

  .ticket{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    overflow:hidden;
    animation:rise .38s ease both;
  }
  .ticket::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background:linear-gradient(180deg, var(--pink), var(--cyan));
  }
  .ticket::after{
    content:"";
    position:absolute;
    right:118px; top:50%;
    transform:translateY(-50%);
    width:22px; height:22px;
    background:var(--bg);
    border-radius:50%;
    box-shadow:
      0 0 0 1px var(--line) inset,
      -1px 0 0 1px var(--bg);
  }
  .ticket-left{min-width:0;}
  .group-name{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:16.5px;
    line-height:1.35;
    margin:0 0 6px;
  }
  .group-meta{
    font-family:'Space Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .ticket-right{
    flex-shrink:0;
    text-align:right;
    padding-left:24px;
    border-left:1.5px dashed var(--line);
    min-width:96px;
  }
  .qty{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:28px;
    color:var(--cyan);
    line-height:1;
  }
  .qty-label{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:6px;
  }

  .empty{
    margin-top:44px;
    padding:30px 24px;
    border:1.5px dashed var(--line);
    border-radius:16px;
    color:var(--muted);
    font-size:14.5px;
    line-height:1.6;
  }
  .empty strong{color:var(--text);}

  .total-strip{
    margin-top:6px;
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    color:var(--muted);
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .total-strip strong{color:var(--pink);}

  footer{
    max-width:640px;
    margin:80px auto 0;
    text-align:center;
    color:#544c6c;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .ticket{animation:none;}
  }
  @media (max-width:480px){
    body{padding:44px 16px 80px;}
    .input-row{flex-direction:column;}
    button{padding:14px;}
    .ticket{flex-direction:column; align-items:flex-start;}
    .ticket-right{border-left:none; border-top:1.5px dashed var(--line); padding-left:0; padding-top:14px; text-align:left; width:100%;}
    .ticket::after{display:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">wonkittiez group orders</div>
    <h1>Find your <span>orders</span></h1>
    <p class="sub">Type the username you ordered under and every group order you're part of will show up below — no need to dig through tabs.</p>

    <div class="search-box">
      <label for="username">Your username</label>
      <div class="input-row">
        <input type="text" id="username" placeholder="e.g. wonspage" autocomplete="off" />
        <button id="searchBtn">Search</button>
      </div>
    </div>

    <div id="output"></div>
  </div>

  <footer>updated by wonkittiez · type carefully, usernames are matched as typed</footer>

<script>
  // ---------------------------------------------------------------
  // DATA: one entry per group order tab. To add another group order,
  // copy a block below and paste your rows in as {username, qty}.
  // ---------------------------------------------------------------
  const orders = [
    {
      group: "blood Saga — busan ld",
      data: [
        { username: "wonspage", qty: 15, status: "ready to ship" },
        { username: "mary_jane9503", qty: 2, status: "ready to ship" },
        { username: "ayutatm", qty: 3, status: "ready to ship" }
      ]
    }
    {
      group: "the sin: bliss weverse global standard pob",
      data: [
        { username: "pshfvngs", qty: 3, status: "ordered" },
        { username: "engene_jakeyjakey", qty: 3, status: "ordered" },
        { username: "wintryhoon", qty: 10, status: "ordered" },
        { username: "healingning", qty: 4, status: "ordered" },
        { username: "mary_jane9503", qty: 5, status: "ordered" }
      ]
    }
    {
      group: "the sin: bliss weverse global engene pob",
      data: [
        { username: "pshfvngs", qty: 3, status: "ordered" },
        { username: "engene_jakeyjakey", qty: 3, status: "ordered" },
        { username: "wintryhoon", qty: 10, status: "ordered" },
        { username: "healingning", qty: 2, status: "ordered" },
        { username: "mary_jane9503", qty: 9, status: "ordered" },
        { username: "wonspage", qty: 24, status: "ordered" },
        { username: "luvsnowz", qty: 1, status: "ordered" }
      ]
    }
    {
      group: "blood saga busan event - day 2 GO",
      data: [
        { username: "pshfvngs", qty: 7, status: "ordered" },
        { username: "bluenoon_1009", qty: 1, status: "ordered" },
        { username: "bambitrades", qty: 3, status: "ordered" },
        { username: "healingning", qty: 6, status: "ordered" },
        { username: "mary_jane9503", qty: 8, status: "ordered" },
        { username: "wonspage", qty: 23, status: "ordered" },
        { username: "luvsnowz", qty: 1, status: "ordered" },
        { username: "ayutatm", qty: 6, status: "ordered" },
        { username: "movinsoobin", qty: 1, status: "ordered" }
      ]
    }
    {
      group: "blood saga busan event - day 1 GO",
      data: [
        { username: "pshfvngs", qty: 9, status: "ordered" },
        { username: "bluenoon_1009", qty: 1, status: "ordered" },
        { username: "bambitrades", qty: 3, status: "ordered" },
        { username: "healingning", qty: 8, status: "ordered" },
        { username: "mary_jane9503", qty: 6, status: "ordered" },
        { username: "wonspage", qty: 20, status: "ordered" },
        { username: "luvsnowz", qty: 1, status: "ordered" },
        { username: "ayutatm", qty: 4, status: "ordered" },
        { username: "inmysoul4jayy", qty: 2, status: "ordered" },
        { username: "nnikisu", qty: 3, status: "ordered" },
        { username: "tannienluvs", qty: 4, status: "ordered" },
        { username: "movinsoobin", qty: 2, status: "ordered" }
      ]
    }
    {
      group: "enchin merch",
      data: [
        { username: "nnikisu", item: "1 noxstar face cushion", status: "ready to ship" },
        { username: "mary_jane9503", item: "1 - manila exclusive phone strap", status: "ready to ship" },
      ]
    }
  ];

  const input = document.getElementById('username');
  const output = document.getElementById('output');
  const btn = document.getElementById('searchBtn');

  function render(query){
    output.innerHTML = "";
    if(!query.trim()){
      return;
    }
    const q = query.trim().toLowerCase();
    const matches = [];
    orders.forEach(group => {
      group.data.forEach(row => {
        if(row.username.toLowerCase() === q){
          matches.push({ group: group.group, qty: row.qty });
        }
      });
    });

    if(matches.length === 0){
      output.innerHTML = `
        <div class="empty">
          <strong>No orders found for "${escapeHtml(query.trim())}".</strong><br/>
          Double-check the spelling, or make sure it matches exactly what you used when ordering.
        </div>`;
      return;
    }

    const status = document.createElement('div');
    status.className = 'status-line';
    status.innerHTML = `<strong>${matches.length}</strong> group order${matches.length > 1 ? 's' : ''} found for <strong>${escapeHtml(query.trim())}</strong>`;
    output.appendChild(status);

    const results = document.createElement('div');
    results.className = 'results';

    let total = 0;
    matches.forEach(m => {
      total += Number(m.qty) || 0;
      const ticket = document.createElement('div');
      ticket.className = 'ticket';
      ticket.innerHTML = `
        <div class="ticket-left">
          <p class="group-name">${escapeHtml(m.group)}</p>
          <p class="group-meta">group order</p>
        </div>
        <div class="ticket-right">
          <div class="qty">${m.qty}</div>
          <div class="qty-label">sets</div>
        </div>`;
      results.appendChild(ticket);
    });

    output.appendChild(results);

    if(matches.length > 1){
      const totalStrip = document.createElement('div');
      totalStrip.className = 'total-strip';
      totalStrip.innerHTML = `total across all group orders: <strong>${total} sets</strong>`;
      output.appendChild(totalStrip);
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  btn.addEventListener('click', () => render(input.value));
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') render(input.value); });
</script>
</body>
</html>
